<text x="35" y="940" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#1a2a3d">RSH-L de 1 Ω: I ≈ 14,93 mA; OUT ≈ 0,747 V.</text>
<text x="35" y="980" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#1a2a3d">RSH-H de 0,1 Ω: I ≈ 14,99 mA; OUT ≈ 0,075 V.</text>
<text x="35" y="1020" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#1a2a3d">Fonte regulada; limite de 30 mA se disponível. Os dois pontos no módulo são as soldas nas pernas.</text>
