<text x="950" y="815" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#1a2a3d">CF = 10 nF</text>
<text x="950" y="841" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#1a2a3d">cerâmico</text>
<polyline points="1320,800 1320,920" fill="none" stroke="#285fb0" stroke-width="3" stroke-linejoin="round"/>
<circle cx="1320" cy="920" r="5" fill="#1a2a3d"/>
<text x="500" y="960" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#1a2a3d">GND comum: AUX LO + negativo da fonte + GND do INA + GND do Due</text>
<text x="35" y="1000" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#1a2a3d">Sem Due: retire RF/CF e meça OUT contra GND com o multímetro em tensão DC.</text>
<text x="35" y="1040" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#1a2a3d">RSH-L: até 50 mA neste roteiro. RSH-H: até 500 mA. OUT nominal máximo = 2,5 V.</text>
<text x="35" y="1080" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#1a2a3d">Comece em STBY, com o circuito fechado. Não conecte a fonte de 3,3 V ao caminho AUX HI → shunt → AUX LO.</text>
</svg>