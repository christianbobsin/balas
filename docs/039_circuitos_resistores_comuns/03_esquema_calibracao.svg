<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1120" viewBox="0 0 1560 1120"><rect width="100%" height="100%" fill="white"/>
<text x="35" y="45" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#1a2a3d">3. Calibração DC com o Fluke 5500A</text>
<text x="35" y="83" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#1a2a3d">O Fluke injeta corrente somente no shunt. RT de 220 Ω é retirado. Fonte separada de 3,3 V alimenta o INA.</text>
