<text x="960" y="625" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#b04c18">para a carga</text>
<text x="90" y="684" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#182b40">C = corrente: terminais externos largos. S = sense: terminais internos estreitos.</text>
<text x="90" y="726" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#182b40">Solde um adaptador em C1, outro em S1, outro em S2 e outro em C2.</text>
<text x="90" y="766" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#182b40">Não adicione pontes C1–S1 ou S2–C2. Não corte o metal original.</text>
