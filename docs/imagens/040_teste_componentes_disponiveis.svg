<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1100" viewBox="0 0 1560 1100"><rect width="100%" height="100%" fill="white"/>
<text x="35" y="45" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#182b40">Teste com os componentes que você já tem</text>
<text x="35" y="83" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#182b40">Arduino Due + placa TI INA180A2 + protoboard. Alimentação somente de 3,3 V.</text>
<text x="35" y="123" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182b40">Os resistores de 470 Ω continuam com DOIS terminais cada. Não use os SR10 neste teste.</text>
<text x="55" y="198" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#182b40">CAMINHO DA CORRENTE</text>
<text x="55" y="255" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#b34a22">Due 3,3 V</text>
<polyline points="80,290 250,290" fill="none" stroke="#b34a22" stroke-width="4" stroke-linejoin="round"/>
<rect x="250" y="270" width="180" height="40" rx="3" fill="#fff4da" stroke="#182b40" stroke-width="2"/>
<polyline points="430,290 590,290" fill="none" stroke="#b34a22" stroke-width="4" stroke-linejoin="round"/>
<rect x="590" y="273" width="100" height="34" rx="3" fill="white" stroke="#182b40" stroke-width="2"/>
<polyline points="690,290 835,290" fill="none" stroke="#b34a22" stroke-width="4" stroke-linejoin="round"/>
<rect x="835" y="270" width="185" height="40" rx="3" fill="#fff4da" stroke="#182b40" stroke-width="2"/>
<polyline points="1020,290 1310,290" fill="none" stroke="#b34a22" stroke-width="4" stroke-linejoin="round"/>
<text x="255" y="244" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182b40">P20: 20 kΩ fixos</text>
<text x="260" y="342" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40">pontas externas</text>
<text x="585" y="244" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182b40">R1: 1 kΩ</text>
<text x="845" y="244" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182b40">P5: 0 a 5 kΩ</text>
<text x="845" y="342" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40">ligação abaixo</text>
<circle cx="1120" cy="290" r="5" fill="#182b40"/>
<text x="1110" y="253" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#16824c">M</text>
<polyline points="1130,290 1130,375" fill="none" stroke="#b34a22" stroke-width="4" stroke-linejoin="round"/>
<rect x="1110" y="375" width="40" height="95" rx="3" fill="white" stroke="#182b40" stroke-width="2"/>
<polyline points="1130,470 1130,525 1310,525 1310,470" fill="none" stroke="#b34a22" stroke-width="4" stroke-linejoin="round"/>
<rect x="1290" y="375" width="40" height="95" rx="3" fill="white" stroke="#182b40" stroke-width="2"/>
<polyline points="1310,375 1310,290" fill="none" stroke="#b34a22" stroke-width="4" stroke-linejoin="round"/>
<text x="1050" y="410" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40">470 Ω</text>
<text x="1350" y="410" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40">470 Ω</text>
<polyline points="1220,525 1220,570 80,570" fill="none" stroke="#b34a22" stroke-width="4" stroke-linejoin="round"/>
<circle cx="1220" cy="525" r="5" fill="#182b40"/>
<text x="55" y="607" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#182b40">Due GND</text>
<text x="895" y="610" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182b40">470 Ω em paralelo com 470 Ω = 235 Ω</text>
<polyline points="1120,290 1120,210 1470,210" fill="none" stroke="#16824c" stroke-width="3" stroke-linejoin="round"/>
<text x="1200" y="191" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#16824c">M → INA IN+</text>
<rect x="50" y="665" width="610" height="365" rx="3" fill="#eef5fc" stroke="#182b40" stroke-width="2"/>
<text x="75" y="704" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#182b40">LIGAÇÕES DA PLACA TI</text>
<text x="80" y="750" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#285fb0">INA VS       → Due 3,3 V</text>
<text x="80" y="794" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#285fb0">INA GND    → Due GND</text>
<text x="80" y="838" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#285fb0">INA IN−      → Due GND</text>
<text x="80" y="882" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#285fb0">INA IN+      → ponto M</text>
<text x="80" y="926" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#285fb0">INA OUT    → Due A0</text>
<text x="75" y="995" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40">Ponto M: após P5 e antes dos dois 470 Ω.</text>
<rect x="710" y="665" width="800" height="365" rx="3" fill="#fffaf0" stroke="#182b40" stroke-width="2"/>
<text x="735" y="704" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#182b40">COMO LIGAR OS POTENCIÔMETROS</text>
<text x="740" y="748" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#182b40">P20 = 20 kΩ</text>
<circle cx="790" cy="790" r="5" fill="#182b40"/>
<text x="783" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">A</text>
<circle cx="920" cy="790" r="5" fill="#182b40"/>
<text x="913" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">B</text>
<circle cx="1050" cy="790" r="5" fill="#182b40"/>
<text x="1043" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">C</text>
<polyline points="790,790 790,818" fill="none" stroke="#285fb0" stroke-width="3" stroke-linejoin="round"/>
<polyline points="1050,790 1050,818" fill="none" stroke="#285fb0" stroke-width="3" stroke-linejoin="round"/>
<text x="1095" y="790" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">A e C: pontas externas</text>
<text x="1095" y="819" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">B central: deixe livre</text>
<text x="740" y="866" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#182b40">P5 = 5 kΩ</text>
<circle cx="790" cy="907" r="5" fill="#182b40"/>
<text x="783" y="895" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">A</text>
<circle cx="920" cy="907" r="5" fill="#182b40"/>
<text x="913" y="895" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">B</text>
<circle cx="1050" cy="907" r="5" fill="#182b40"/>
<text x="1043" y="895" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">C</text>
<polyline points="790,907 790,949" fill="none" stroke="#285fb0" stroke-width="3" stroke-linejoin="round"/>
<polyline points="920,907 920,949 1050,949 1050,907" fill="none" stroke="#285fb0" stroke-width="3" stroke-linejoin="round"/>
<text x="1095" y="913" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">A: vem de R1 de 1 kΩ</text>
<text x="1095" y="945" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182b40">B unido a C: vai para M</text>
<text x="740" y="995" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#182b40">A e C são os extremos; B é o cursor central.</text>
<text x="45" y="1070" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#182b40">Saída calculada: aproximadamente 1,48 a 1,83 V. Valores reais dependem das tolerâncias.</text>
</svg>