<text x="830" y="1110" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#1260a0">Terminal Kelvin do lado da PLACA MEDIDA do shunt</text>
<rect x="60" y="1127" width="1780" height="51" fill="#f7f9fb" stroke="#dce2e9" stroke-width="1"/>
