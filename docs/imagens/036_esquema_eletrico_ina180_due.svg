<text x="514" y="1212" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#182536">TP214</text>
<text x="830" y="1212" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#182536">R1 de 100 Ω → A0; C1 de 10 nF entre A0 e GND</text>
<rect x="60" y="1229" width="1780" height="51" fill="#f7f9fb" stroke="#dce2e9" stroke-width="1"/>
<text x="78" y="1263" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#187448">VS</text>
<text x="285" y="1263" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#187448">5</text>
<text x="514" y="1263" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#187448">TP211</text>
<text x="830" y="1263" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#187448">Pino 3V3 do Arduino Due</text>
<text x="60" y="1330" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#187448">Os dois rótulos +3V3 representam a mesma ligação: 3V3 do Due → VS / TP211 do INA.</text>
<text x="60" y="1372" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="700" fill="#1260a0">IN− vai ao lado positivo da placa APÓS o shunt. Não confundir IN− com GND.</text>
<text x="60" y="1413" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#182536">Use um shunt por vez. LOW: 1 Ω / até 40 mA. HIGH: 0,1 Ω / até 400 mA. Troque com tudo desligado.</text>
<text x="60" y="1450" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536171">C = terminal de corrente; S = terminal Kelvin. Pinos do CI válidos para INA180A2IDBV instalado em U2.</text>
<text x="60" y="1485" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#536171">Referência: TI SBOU183, figura 1. Os pontos TP são conexões na EVM; não são números de pinos do CI.</text>
</svg>