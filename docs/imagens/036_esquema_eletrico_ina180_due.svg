<text x="514" y="1161" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#182536">TP215</text>
<text x="830" y="1161" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#182536">GND do Due + negativo da fonte + GND da placa medida</text>
<rect x="60" y="1178" width="1780" height="51" fill="white" stroke="#dce2e9" stroke-width="1"/>
<text x="78" y="1212" text-anchor="start" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#182536">OUT</text>
