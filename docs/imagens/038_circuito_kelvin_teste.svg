<text x="160" y="680" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#315caa">alimentação do INA</text>
<text x="40" y="917" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#182b40">Laranja: corrente da carga. Verde: medição nos terminais S. Azul: alimentação e leitura.</text>
<text x="40" y="955" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#182b40">1 Ω → I ≈ 14,93 mA; OUT ≈ 0,747 V.   0,1 Ω → I ≈ 14,99 mA; OUT ≈ 0,075 V.</text>
<text x="40" y="995" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#182b40">Os pontos pretos dentro do shunt são internos. Na protoboard, C e S usam contatos separados.</text>
