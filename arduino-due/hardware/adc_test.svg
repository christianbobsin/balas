<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020">
  <title>Três circuitos simples para validar o ADC do Arduino Due</title>
  <desc>Potenciômetro de 5 kiloohms, divisor com dois resistores de 1 kiloohm e teste de LED com resistor de sense de 1 kiloohm. Todos usam a alimentação 3V3 do próprio Due e um resistor de 1 kiloohm em série com A0.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
    <style>
      text {font-family: sans-serif; fill: #0f172a; font-size: 18px;}
      .title {font-size: 26px; font-weight: bold;}
      .heading {font-size: 21px; font-weight: bold;}
      .small {font-size: 16px;}
      .wire {fill: none; stroke: #334155; stroke-width: 3;}
      .signal {fill: none; stroke: #2563eb; stroke-width: 3;}
      .resistor {fill: white; stroke: #334155; stroke-width: 3;}
      .node {fill: #2563eb;}
    </style>
  </defs>
  <rect width="1000" height="1020" fill="white"/>
  <text x="40" y="42" class="title">Arduino Due — validação do ADC em A0</text>
  <text x="40" y="70" class="small">Monte uma opção por vez. Alimentação somente pelo 3V3 e GND do próprio Due.</text>

  <rect x="30" y="90" width="940" height="270" rx="12" fill="#f1f5f9"/>
  <text x="50" y="125" class="heading">1. Com potenciômetro: tensão ajustável de 0 a 3,3 V</text>
  <text x="150" y="162">Due 3V3</text>
  <path class="wire" d="M220 170 V195 M220 265 V300"/>
  <rect class="resistor" x="209" y="195" width="22" height="70"/>
  <text x="65" y="223" class="small">P1: 5 kΩ</text>
  <text x="50" y="246" class="small">linear preferível</text>
  <path class="signal" d="M310 230 H760"/>
  <path class="wire" d="M310 230 H235" marker-end="url(#arrow)"/>
  <text x="320" y="210" class="small">cursor</text>
  <rect class="resistor" x="470" y="219" width="64" height="22"/>
  <text x="440" y="205" class="small">Rproteção: 1 kΩ</text>
  <circle class="node" cx="760" cy="230" r="5"/>
  <text x="780" y="236">Due A0</text>
  <path class="wire" d="M198 300 H242 M204 308 H236 M211 316 H229"/>
  <text x="270" y="310">Due GND</text>
  <text x="50" y="344" class="small">Os dois extremos de P1 vão a 3V3 e GND; o cursor vai a A0 através de Rproteção.</text>

  <rect x="30" y="375" width="940" height="285" rx="12" fill="#f1f5f9"/>
  <text x="50" y="410" class="heading">2. Sem potenciômetro: divisor com ponto médio de ≈1,65 V</text>
  <text x="150" y="445">Due 3V3</text>
  <path class="wire" d="M220 452 V470 M220 505 V530 M220 530 V555 M220 590 V615"/>
  <rect class="resistor" x="209" y="470" width="22" height="35"/>
  <rect class="resistor" x="209" y="555" width="22" height="35"/>
  <text x="95" y="494">R1: 1 kΩ</text>
  <text x="95" y="578">R2: 1 kΩ</text>
  <circle class="node" cx="220" cy="530" r="5"/>
  <path class="signal" d="M220 530 H760"/>
  <rect class="resistor" x="470" y="519" width="64" height="22"/>
  <text x="440" y="500" class="small">Rproteção: 1 kΩ</text>
  <circle class="node" cx="760" cy="530" r="5"/>
  <text x="780" y="536">Due A0</text>
  <text x="300" y="565" class="small">Ponto médio: ADC ≈2048</text>
  <path class="wire" d="M198 615 H242 M204 623 H236 M211 631 H229"/>
  <text x="270" y="625">Due GND</text>
  <text x="50" y="647" class="small">Para testar os extremos, mova somente a origem de Rproteção para GND ou 3V3.</text>

  <rect x="30" y="675" width="940" height="280" rx="12" fill="#f1f5f9"/>
  <text x="50" y="710" class="heading">3. Opcional: LED e resistor comum como sense de corrente</text>
  <text x="65" y="770">Due 3V3</text>
  <path class="wire" d="M155 795 H320 M350 795 H510 M510 795 V835 M510 875 V900"/>
  <rect class="resistor" x="185" y="784" width="64" height="22"/>
  <text x="170" y="762" class="small">RLED: 1 kΩ</text>
  <path d="M320 782 L320 808 L343 795 Z" fill="white" stroke="#334155" stroke-width="3"/>
  <path class="wire" d="M347 779 V811 M326 777 L345 758 M341 777 L360 758" marker-end="url(#arrow)"/>
  <text x="290" y="846" class="small">LED vermelho</text>
  <text x="275" y="870" class="small">ânodo à esquerda</text>
  <circle class="node" cx="510" cy="795" r="5"/>
  <path class="signal" d="M510 795 H810"/>
  <rect class="resistor" x="650" y="784" width="64" height="22"/>
  <text x="620" y="766" class="small">Rproteção: 1 kΩ</text>
  <circle class="node" cx="810" cy="795" r="5"/>
  <text x="830" y="801">Due A0</text>
  <rect class="resistor" x="499" y="835" width="22" height="40"/>
  <text x="550" y="857" class="small">Rsense: 1 kΩ</text>
  <text x="550" y="885" class="small">I_LED = V_A0 / 1000 Ω</text>
  <path class="wire" d="M488 900 H532 M494 908 H526 M501 916 H519"/>
  <text x="550" y="922">Due GND</text>
  <text x="50" y="946" class="small">O resistor de sense é comum e não calibrado. O LED pode acender com brilho baixo.</text>

  <text x="40" y="988" fill="#b91c1c" class="heading">A0 aceita somente 0–3,3 V. Nunca conectar 5V ou VIN a A0.</text>
  <text x="40" y="1012" class="small">O resistor de 1 kΩ não torna a entrada tolerante a 5 V. Desligue a USB antes de mudar a montagem.</text>
</svg>
