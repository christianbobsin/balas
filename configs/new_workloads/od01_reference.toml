# Referência fase 1 — od01 (E6): TinyissimoYOLO para detecção de objetos e faces (WIDER FACE).
# Modelo único com pesos aleatórios; sem espaço de busca nesta fase.
# Esperado: 509.330 params, 29.178.880 MACs; não cabe em nenhuma placa (limitação conhecida).

[experiment]
name = "od01_reference"
benchmark = "object_detection"
base_seed = 72
profiling_samples = 10
output_csv = "artifacts/{target}/od01_reference.csv"
output_map = "artifacts/{target}/od01_reference_map.json"

[hyperparameters.grid]
variant = ["reference"]

[model_specs]
input_shape = [88, 88, 3]
num_classes = 176
