# Referência fase 1 — ecg01 (E3): transformer pequeno para batimentos de ECG (MIT-BIH Arrhythmia).
# Modelo único com pesos aleatórios; sem espaço de busca nesta fase.
# Esperado: 4.713 params, 86.096 MACs.

[experiment]
name = "ecg01_reference"
benchmark = "ecg_classification"
base_seed = 72
profiling_samples = 10
output_csv = "artifacts/{target}/ecg01_reference.csv"
output_map = "artifacts/{target}/ecg01_reference_map.json"

[hyperparameters.grid]
variant = ["reference"]

[model_specs]
input_shape = [256, 1]
num_classes = 5
