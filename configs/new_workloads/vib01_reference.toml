# Referência fase 1 — vib01 (E4): autoencoder denso (topologia do AD do MLPerf Tiny) para anomalia em vibração (CWRU / IMS Bearing).
# Modelo único com pesos aleatórios; sem espaço de busca nesta fase.
# Esperado: 232.968 params, 231.424 MACs.

[experiment]
name = "vib01_reference"
benchmark = "vibration_anomaly"
base_seed = 72
profiling_samples = 10
output_csv = "artifacts/{target}/vib01_reference.csv"
output_map = "artifacts/{target}/vib01_reference_map.json"

[hyperparameters.grid]
hidden_units = [128]
bottleneck_units = [8]
num_hidden_layers = [4]

[model_specs]
input_shape = [1, 512]
num_classes = 512
